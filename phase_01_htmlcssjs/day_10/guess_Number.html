<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center mt-5">
    <div class="card p-4 shadow" style="width:350px;">
        <h3 class="text-center">🎮 Guess the Number</h3>
        <p class="text-center">Guess a number between 1 and 10</p>

        <input type="number" id="guess" class="form-control mb-3" min="1" max="10">

        <button class="btn btn-primary mb-2" onclick="checkGuess()">Check</button>

        <button class="btn btn-dark" onclick="newGame()">New Game</button>

        <h5 id="result" class="text-center mt-3"></h5>
    </div>
</div>
</body>
</html>
<script>
    let randomNumber = Math.floor(Math.random() * 10) + 1;

function checkGuess() {

    let guess = Number(document.getElementById("guess").value);
    let result = document.getElementById("result");

    if (guess < 1 || guess > 10 ) {
        result.innerHTML = "Enter a number between 1 and 10";
        result.style.color = "orange";
    }
    else if (guess < randomNumber) {
        result.innerHTML = "Too Low!";
        result.style.color = "red";
    }
    else if (guess > randomNumber) {
        result.innerHTML = "Too High!";
        result.style.color = "red";
    }
    else {
        result.innerHTML = "Correct!";
        result.style.color = "green";
    }
}

function newGame() {
    randomNumber = Math.floor(Math.random() * 10) + 1;
    document.getElementById("guess").value = "";
    document.getElementById("result").innerHTML = "";
}
</script>
