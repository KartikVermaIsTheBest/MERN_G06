<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      #container {
        display: flex;
        margin-top: 50px;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="card" style="width: 500px">
        <div class="card-body">
          <h3 style="text-align: center">🎵 Music Queue</h3>
          <h5 id="playing">Now Playing: None</h5>
          <div class="input-group flex-nowrap">
            <input
              type="text"
              id="songvalue"
              class="form-control"
              placeholder="Enter Song Name"
              aria-label="Username"
              aria-describedby="addon-wrapping"
            />
          </div>
          <div style="margin-top: 20px">
            <button
              type="button"
              onclick="addSong()"
              class="btn btn-primary btn-sm"
            >
              Add Song
            </button>
            <button
              type="button"
              onclick="playsong()"
              class="btn btn-secondary btn-sm btn-success"
            >
              Play Song
            </button>
          </div>
        </div>
        <div id="player"></div>
      </div>
    </div>
  </body>
</html>
<script>
  let songs = []
  let player = document.getElementById("player")
  let songInp = document.getElementById("songvalue")

  let renderSongs = () => {
    player.innerHTML = ``
    songs.forEach((el, index) => {
      player.innerHTML += `
                <p style="border-bottom: 1px solid black; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span>${index + 1}. ${el}</span>
                    <button type="button" onclick="deletesong(${index})" class="btn btn-danger btn-sm">Delete</button>
                </p>
                
            `
    })
  }

  let addSong = () => {
    const songName = songInp.value.trim()
    if (songName) {
      songs.push(songName)
      songInp.value = ""
      renderSongs()
    }
  }

  let playsong = () => {
    let playing = document.getElementById("playing")
    let firstSong = songs.length > 0 ? songs.shift() : "None"
    playing.innerText = `Now Playing: ${firstSong}`
    renderSongs()
  }

  let deletesong = (index) => {
    songs.splice(index, 1)
    renderSongs()
  }
</script>
