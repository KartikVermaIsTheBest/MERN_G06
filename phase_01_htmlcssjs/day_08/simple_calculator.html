<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <h1>Simple Calculator</h1>  

        <input id="first" type="text" placeholder="Enter Your First Number">
        <input id="second" type="text" placeholder="Enter Your Second Number">
        <div class="button">
            
            <button onclick="add()">ADD</button>
            <button onclick="subtract()">SUBTRACT</button>
            <button onclick="multiply()">MULTIPLY</button>
            <button onclick="divide()">DIVIDE</button>
            <button onclick="clearFields()">CLEAR</button>
        </div>

        <h1 id="output"></h1>
    </div>

</body>
</html>
<script>
let firstInput = document.getElementById("first");
let secondInput = document.getElementById("second");
let output = document.getElementById("output");

function add() {
    let num1 = Number(firstInput.value);
    let num2 = Number(secondInput.value);

    output.innerHTML = "Result : " + (num1 + num2);
    output.style.color = "red";
}

function subtract() {
    let num1 = Number(firstInput.value);
    let num2 = Number(secondInput.value);

    output.innerHTML = "Result : " + (num1 - num2);
}

function multiply() {
    let num1 = Number(firstInput.value);
    let num2 = Number(secondInput.value);

    output.innerHTML = "Result : " + (num1 * num2);
}

function divide() {
    let num1 = Number(firstInput.value);
    let num2 = Number(secondInput.value);

    output.innerHTML = "Result : " + (num1 / num2);
}

function clearFields() {
    firstInput.value = "";
    secondInput.value = "";
    output.innerHTML = "";
}

</script>
