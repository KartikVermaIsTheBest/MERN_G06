<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Password: </label>
    <input id="pass-holder" type="password" placeholder="Enter Your Password">
    <br>
    <button onclick="checkPass()">Submit</button>
    <p id="output"></p>
</body>
</html>
<script>
    var holder = document.getElementById("pass-holder")
    var output = document.getElementById("output")

    function checkPass(){
        let passValue = holder.value

        if(passValue.length < 8){
            output.innerHTML = "Weak Password"
        }
        else if(passValue.length >= 8 && passValue.length <= 12){
            output.innerHTML = "Good Password"
        }
        else{
            output.innerHTML = "Strong Password"
        }

        holder.value = ""
    }

</script>
