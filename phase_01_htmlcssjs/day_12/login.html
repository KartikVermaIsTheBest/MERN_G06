<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Card</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f4f4;
      }

      .student-card {
        border: 2px solid #0d6efd;
        border-radius: 12px;
        padding: 20px;
        background: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <!-- Form -->
        <div class="col-md-5">
          <div class="card shadow">
            <div class="card-body">
              <h3 class="text-center mb-4">login Page</h3>

              <form id="studentForm" onsubmit="handleSubmit(event)">

                <input
                  type="email"
                  id="email"
                  class="form-control mb-3"
                  placeholder="Enter Email"
                  required
                />

                <input
                  type="password"
                  id="password"
                  class="form-control mb-3"
                  placeholder="Enter Password"
                  required
                />

                <button class="btn btn-primary w-100">Submit</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Output -->
        <div class="col-md-5 mt-4 mt-md-0">
          <div id="output"></div>
        </div>
      </div>
    </div>
  </body>
</html>
<script>
  let handleSubmit = (event) => {
    event.preventDefault();

    const form = document.getElementById("studentForm");
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    let user_data = localStorage.getItem("users");
    let users_array;
    if (user_data == null) {
      users_array = [];
    } else {
      users_array = JSON.parse(user_data);
    }

    let user_exists = users_array.find((el) => el.email == email);
    console.log(user_exists);

    if(user_exists && user_exists.password == password){
        localStorage.setItem("current_user",JSON.stringify(user_exists))
        localStorage.setItem("isLoggedIn" , "true")
        alert("User Logged In Successfully")
        window.location.href = "products.html";
    }
    else{
        alert("Invalid Credentials")
    }

    form.reset();
  };
</script>
